on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      # Builds as 0.0.0 from master because workflow_dispatch has no tag.
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0' }}
    steps:
      - uses: actions/checkout@v6

      - name: Require the matching MonsieurVerite tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git ls-remote --exit-code --tags https://github.com/The-Steambird/MonsieurVerite "refs/tags/${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::MonsieurVerite has no tag ${{ github.ref_name }}. Tag the GUI repo with the same version and re-run."
            exit 1
          }

      - name: Check out MonsieurVerite
        uses: actions/checkout@v6
        with:
          repository: The-Steambird/MonsieurVerite
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'master' }}
          path: gui

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Download custom ffmpeg
        run: gh release download tools --pattern ffmpeg.exe --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build with PyInstaller
        run: uv run pyinstaller charlotte.spec

      - name: Smoke test
        run: dist/charlotte-cli.exe --version

      # ---- MonsieurVerite bundle -----

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: gui/**/packages.lock.json

      - name: Publish MonsieurVerite
        run: >
          dotnet publish gui/MonsieurVerite/MonsieurVerite.csproj
          -c Release -p:Version=${{ env.VERSION }} -o bundle

      # .zip contains charlotte-cli.exe + charlotte-gui.exe.
      # charlotte-cli --update updates its own .exe; GUI unpacks the entire archive.
      - name: Assemble bundle
        run: |
          Copy-Item dist/charlotte-cli.exe bundle/
          Compress-Archive -Path bundle/* -DestinationPath dist/charlotte-${{ env.VERSION }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: charlotte
          path: dist/*

      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: true
          prerelease: false