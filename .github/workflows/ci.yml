on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Download custom ffmpeg
        run: gh release download tools --pattern ffmpeg.exe --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run tests
        run: uv run pytest -q

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check dependencies
        run: uv run deptry .
